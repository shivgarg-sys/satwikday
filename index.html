<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>140km Carpool Optimizer</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for Browser JSX Execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-12">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // Initial pre-populated data for 12 participants traveling 140km
    const INITIAL_PARTICIPANTS = [
      { id: '1', name: 'Alex M.', isDriver: true, seats: 4, address: 'Central Park West, NY', time: '18:00', lat: 40.7812, lng: -73.9665, fixedDriverId: null },
      { id: '2', name: 'Brian K.', isDriver: true, seats: 5, address: 'Brooklyn Heights, NY', time: '18:15', lat: 40.6960, lng: -73.9936, fixedDriverId: null },
      { id: '3', name: 'Charlie R.', isDriver: true, seats: 4, address: 'Queens Plaza, NY', time: '18:00', lat: 40.7505, lng: -73.9400, fixedDriverId: null },
      { id: '4', name: 'David L.', isDriver: false, seats: 0, address: 'Upper East Side, NY', time: '18:10', lat: 40.7736, lng: -73.9566, fixedDriverId: '1' },
      { id: '5', name: 'Ethan P.', isDriver: false, seats: 0, address: 'Williamsburg, NY', time: '18:20', lat: 40.7081, lng: -73.9571, fixedDriverId: '2' },
      { id: '6', name: 'Frank W.', isDriver: false, seats: 0, address: 'Astoria, NY', time: '18:05', lat: 40.7644, lng: -73.9235, fixedDriverId: null },
      { id: '7', name: 'George T.', isDriver: false, seats: 0, address: 'Midtown East, NY', time: '18:00', lat: 40.7549, lng: -73.9740, fixedDriverId: null },
      { id: '8', name: 'Harry S.', isDriver: false, seats: 0, address: 'Greenpoint, NY', time: '18:15', lat: 40.7305, lng: -73.9515, fixedDriverId: null },
      { id: '9', name: 'Ian V.', isDriver: false, seats: 0, address: 'Bushwick, NY', time: '18:30', lat: 40.6944, lng: -73.9213, fixedDriverId: null },
      { id: '10', name: 'Jack B.', isDriver: false, seats: 0, address: 'Long Island City, NY', time: '18:10', lat: 40.7447, lng: -73.9485, fixedDriverId: null },
      { id: '11', name: 'Kevin H.', isDriver: false, seats: 0, address: 'Lower East Side, NY', time: '18:25', lat: 40.7150, lng: -73.9843, fixedDriverId: null },
      { id: '12', name: 'Liam O.', isDriver: false, seats: 0, address: 'Harlem, NY', time: '18:00', lat: 40.8115, lng: -73.9465, fixedDriverId: null }
    ];

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('roster');
      const [tripCode] = useState('NIGHTOUT-140KM');
      const [participants, setParticipants] = useState(INITIAL_PARTICIPANTS);
      const [lastSynced, setLastSynced] = useState(new Date().toLocaleTimeString());
      const [copied, setCopied] = useState(false);
      const [jsonInput, setJsonInput] = useState('');
      const [showJsonModal, setShowJsonModal] = useState(false);

      const [newPerson, setNewPerson] = useState({
        name: '', isDriver: false, seats: 4, address: '', time: '18:00', fixedDriverId: ''
      });

      const [tripDistanceKm, setTripDistanceKm] = useState(140);
      const [fuelPricePerLitre, setFuelPricePerLitre] = useState(1.85);
      const [avgConsumption, setAvgConsumption] = useState(8.0);
      const [tollsAndParking, setTollsAndParking] = useState(30);

      const availableDrivers = useMemo(() => participants.filter(p => p.isDriver), [participants]);

      const handleAddParticipant = (e) => {
        e.preventDefault();
        if (!newPerson.name.trim()) return;

        const person = {
          id: Date.now().toString(),
          name: newPerson.name,
          isDriver: newPerson.isDriver,
          seats: newPerson.isDriver ? Number(newPerson.seats) || 4 : 0,
          address: newPerson.address || 'Address provided on phone',
          time: newPerson.time || '18:00',
          lat: 40.7 + (Math.random() - 0.5) * 0.2,
          lng: -73.9 + (Math.random() - 0.5) * 0.2,
          fixedDriverId: !newPerson.isDriver && newPerson.fixedDriverId ? newPerson.fixedDriverId : null
        };

        setParticipants(prev => [...prev, person]);
        setNewPerson({ name: '', isDriver: false, seats: 4, address: '', time: '18:00', fixedDriverId: '' });
        setLastSynced(new Date().toLocaleTimeString());
      };

      const removeParticipant = (id) => {
        setParticipants(prev => prev.filter(p => p.id !== id));
        setLastSynced(new Date().toLocaleTimeString());
      };

      const optimizationResults = useMemo(() => {
        const drivers = participants.filter(p => p.isDriver);
        let remainingPassengers = participants.filter(p => !p.isDriver);

        const cars = drivers.map(driver => ({
          driver,
          capacity: driver.seats,
          passengers: []
        }));

        remainingPassengers = remainingPassengers.filter(passenger => {
          if (passenger.fixedDriverId) {
            const targetCar = cars.find(c => c.driver.id === passenger.fixedDriverId);
            if (targetCar && targetCar.passengers.length < targetCar.capacity - 1) {
              targetCar.passengers.push({
                ...passenger,
                distanceToPickup: calculateDistance(targetCar.driver.lat, targetCar.driver.lng, passenger.lat, passenger.lng).toFixed(1),
                isFixedAssignment: true
              });
              return false;
            }
          }
          return true;
        });

        cars.forEach(car => {
          let currentLat = car.driver.lat;
          let currentLng = car.driver.lng;
          if (car.passengers.length > 0) {
            const lastFixed = car.passengers[car.passengers.length - 1];
            currentLat = lastFixed.lat;
            currentLng = lastFixed.lng;
          }

          const openCapacity = car.capacity - 1 - car.passengers.length;

          for (let i = 0; i < openCapacity; i++) {
            if (remainingPassengers.length === 0) break;

            let closestIdx = 0;
            let minDistance = Infinity;

            remainingPassengers.forEach((p, idx) => {
              const dist = calculateDistance(currentLat, currentLng, p.lat, p.lng);
              if (dist < minDistance) {
                minDistance = dist;
                closestIdx = idx;
              }
            });

            const pickedPassenger = remainingPassengers[closestIdx];
            car.passengers.push({
              ...pickedPassenger,
              distanceToPickup: minDistance.toFixed(1),
              isFixedAssignment: false
            });

            currentLat = pickedPassenger.lat;
            currentLng = pickedPassenger.lng;
            remainingPassengers = remainingPassengers.filter((_, idx) => idx !== closestIdx);
          }
        });

        return {
          routes: cars.map(car => ({
            ...car,
            totalPassengers: car.passengers.length,
            filledSeats: car.passengers.length + 1
          })),
          unassigned: remainingPassengers,
          totalSeatsAvailable: drivers.reduce((acc, d) => acc + d.seats, 0),
          totalPeople: participants.length
        };
      }, [participants]);

      const totalFuelCostPerCar = useMemo(() => {
        const roundTripKm = tripDistanceKm * 2;
        const litresNeeded = (roundTripKm / 100) * avgConsumption;
        return (litresNeeded * fuelPricePerLitre) + (tollsAndParking / (optimizationResults.routes.length || 1));
      }, [tripDistanceKm, avgConsumption, fuelPricePerLitre, tollsAndParking, optimizationResults.routes.length]);

      const costPerPerson = useMemo(() => {
        if (participants.length === 0) return 0;
        const grandTotal = totalFuelCostPerCar * (optimizationResults.routes.length || 1);
        return grandTotal / participants.length;
      }, [totalFuelCostPerCar, optimizationResults.routes.length, participants.length]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 font-sans pb-12">
          {/* Header */}
          <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="p-2 bg-indigo-600/20 border border-indigo-500/40 rounded-xl text-indigo-400">
                  <i data-lucide="car" className="w-6 h-6"></i>
                </div>
                <div>
                  <h1 className="text-lg font-bold text-white leading-tight">140km Night Out Carpool</h1>
                  <p className="text-xs text-slate-400 flex items-center gap-2">
                    <span>Room: <strong className="text-indigo-300">{tripCode}</strong></span>
                    <span className="text-emerald-400">Synced: {lastSynced}</span>
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setLastSynced(new Date().toLocaleTimeString())}
                  className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs font-medium border border-slate-700"
                >
                  Sync Now
                </button>
                <button
                  onClick={() => setShowJsonModal(true)}
                  className="px-3 py-1.5 rounded-lg bg-indigo-600/20 text-indigo-300 text-xs font-medium border border-indigo-500/30"
                >
                  WhatsApp Share
                </button>
              </div>
            </div>
          </header>

          {/* Navigation */}
          <div className="max-w-6xl mx-auto px-4 mt-4">
            <div className="flex overflow-x-auto gap-2 p-1 bg-slate-900 border border-slate-800 rounded-xl text-xs">
              <button
                onClick={() => setActiveTab('roster')}
                className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'roster' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
              >
                1. Roster ({participants.length})
              </button>
              <button
                onClick={() => setActiveTab('routes')}
                className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'routes' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
              >
                2. Optimized Routes ({optimizationResults.routes.length} Cars)
              </button>
              <button
                onClick={() => setActiveTab('costs')}
                className={`px-4 py-2 rounded-lg font-medium transition ${activeTab === 'costs' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
              >
                3. Fuel & Toll Splitter
              </button>
            </div>
          </div>

          {/* Body Content */}
          <main className="max-w-6xl mx-auto px-4 mt-6">
            {activeTab === 'roster' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Form */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                  <h2 className="text-base font-bold text-white">Add Your Details</h2>
                  <form onSubmit={handleAddParticipant} className="space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-400 mb-1">Your Name</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Marcus T."
                        value={newPerson.name}
                        onChange={(e) => setNewPerson({ ...newPerson, name: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 mb-1">Pickup Address</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. 742 Evergreen Terrace"
                        value={newPerson.address}
                        onChange={(e) => setNewPerson({ ...newPerson, address: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-slate-400 mb-1">Role</label>
                        <select
                          value={newPerson.isDriver ? 'driver' : 'passenger'}
                          onChange={(e) => setNewPerson({ ...newPerson, isDriver: e.target.value === 'driver' })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                        >
                          <option value="passenger">Passenger</option>
                          <option value="driver">Driver</option>
                        </select>
                      </div>
                      <div>
                        {newPerson.isDriver ? (
                          <div>
                            <label className="block text-slate-400 mb-1">Total Seats</label>
                            <input
                              type="number"
                              min="2"
                              max="8"
                              value={newPerson.seats}
                              onChange={(e) => setNewPerson({ ...newPerson, seats: e.target.value })}
                              className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                            />
                          </div>
                        ) : (
                          <div>
                            <label className="block text-slate-400 mb-1">Fixed Driver</label>
                            <select
                              value={newPerson.fixedDriverId}
                              onChange={(e) => setNewPerson({ ...newPerson, fixedDriverId: e.target.value })}
                              className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white"
                            >
                              <option value="">Auto-Assign</option>
                              {availableDrivers.map(d => (
                                <option key={d.id} value={d.id}>{d.name}</option>
                              ))}
                            </select>
                          </div>
                        )}
                      </div>
                    </div>
                    <button type="submit" className="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-xl mt-2">
                      Submit Entry
                    </button>
                  </form>
                </div>

                {/* List */}
                <div className="lg:col-span-2 space-y-4">
                  <h2 className="text-base font-bold text-white">Participants ({participants.length})</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {participants.map((person) => {
                      const fixedDriver = person.fixedDriverId ? participants.find(p => p.id === person.fixedDriverId) : null;
                      return (
                        <div key={person.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex justify-between">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="font-bold text-white text-sm">{person.name}</span>
                              {person.isDriver ? (
                                <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-500/20 text-indigo-300">
                                  Driver ({person.seats} seats)
                                </span>
                              ) : fixedDriver ? (
                                <span className="px-2 py-0.5 rounded text-[10px] bg-amber-500/20 text-amber-300">
                                  Fixed: {fixedDriver.name}
                                </span>
                              ) : (
                                <span className="px-2 py-0.5 rounded text-[10px] bg-slate-800 text-slate-400">
                                  Passenger
                                </span>
                              )}
                            </div>
                            <p className="text-xs text-slate-400 mt-1">{person.address}</p>
                          </div>
                          <button onClick={() => removeParticipant(person.id)} className="text-slate-600 hover:text-rose-400">
                            ✕
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'routes' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {optimizationResults.routes.map((car, idx) => (
                  <div key={car.driver.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                      <h3 className="font-bold text-white text-sm">Car #{idx + 1}: {car.driver.name}</h3>
                      <span className="text-xs font-bold text-emerald-400">{car.filledSeats}/{car.capacity} Seats</span>
                    </div>
                    <div className="text-xs space-y-2">
                      <p className="text-indigo-300"><strong>Start:</strong> {car.driver.address}</p>
                      {car.passengers.map((p, pIdx) => (
                        <div key={p.id} className="bg-slate-950 p-2 rounded-lg">
                          <p className="text-white font-semibold">Pickup #{pIdx + 1}: {p.name}</p>
                          <p className="text-[11px] text-slate-400">{p.address} (+{p.distanceToPickup} km)</p>
                        </div>
                      ))}
                      <p className="text-amber-400 font-bold pt-2">🏁 Destination (140 km Event)</p>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'costs' && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                <h2 className="text-lg font-bold text-white">Expense Summary</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="text-xs text-slate-400">Per Person Share (All 12 Guys)</p>
                    <p className="text-3xl font-black text-emerald-400">${costPerPerson.toFixed(2)}</p>
                  </div>
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <p className="text-xs text-slate-400">Total Driver Collection per Car</p>
                    <p className="text-3xl font-black text-indigo-400">${totalFuelCostPerCar.toFixed(2)}</p>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
